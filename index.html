<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Grooming Salon Booking Calculator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Dog Grooming Salon Booking Calculator</h1>
        <form id="bookingForm">
            <div class="form-group">
                <label for="customerName">Customer Name:</label>
                <input type="text" id="customerName" required>
            </div>
            <div class="form-group">
                <label for="dogName">Dog Name:</label>
                <input type="text" id="dogName" required>
            </div>
            <div class="form-group">
                <label for="dogSize">Dog Size:</label>
                <select id="dogSize" required>
                    <option value="small">Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                </select>
            </div>
            <div class="form-group">
                <label>Extra Services:</label>
                <div>
                    <input type="checkbox" id="fullBath" value="25">
                    <label for="fullBath">Full Bath (+25 RON)</label>
                </div>
                <div>
                    <input type="checkbox" id="haircutTrim" value="35">
                    <label for="haircutTrim">Haircut & Trim (+35 RON)</label>
                </div>
                <div>
                    <input type="checkbox" id="nailClipping" value="15">
                    <label for="nailClipping">Nail Clipping (+15 RON)</label>
                </div>
                <div>
                    <input type="checkbox" id="earCleaning" value="15">
                    <label for="earCleaning">Ear Cleaning (+15 RON)</label>
                </div>
            </div>
            <div class="form-group">
                <label for="appointmentDateTime">Appointment Date & Time:</label>
                <input type="datetime-local" id="appointmentDateTime" required>
            </div>
            <div class="form-group">
                <label>Total Price (RON):</label>
                <input type="text" id="totalPrice" readonly>
            </div>
            <button type="button" id="calculateTotal">Calculate Total</button>
            <button type="button" id="sendBooking">Send Booking via WhatsApp</button>
        </form>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
